<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wishboard</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Cropper.js CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .masonry-grid {
      column-count: 2;
      column-gap: 1rem;
    }
    @media (min-width: 768px) {
      .masonry-grid {
        column-count: 3;
      }
    }
    @media (min-width: 1024px) {
      .masonry-grid {
        column-count: 4;
      }
    }
    .break-inside-avoid {
      break-inside: avoid;
    }
    .toast-enter {
      animation: fadeInDown 0.3s forwards, fadeOutUp 0.3s 2.7s forwards;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOutUp {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-20px); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-24">

  <!-- Toast Notification System -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 items-center w-11/12 max-w-sm"></div>

  <!-- Sticky Top Bar (Nav & Budget Overview) -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">Wishboard</h1>
        <div id="sticky-top-summary" class="text-xs font-semibold text-slate-500">
          Total Desired: <span id="top-total-val" class="text-slate-900 font-bold">$0.00</span>
          <span id="top-subtext" class="text-slate-400 font-normal ml-1">(before taxes)</span>
        </div>
      </div>
      <button onclick="openPinModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-full shadow-md transition-all active:scale-95 flex items-center justify-center">
        <i class="fa-solid font-bold fa-plus text-base"></i>
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-4xl mx-auto px-4 flex gap-2 overflow-x-auto pb-2 scrollbar-none" id="tabs-bar">
      <button onclick="switchTab('wishlist')" id="tab-wishlist" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-900 text-white">
        Wishlist
      </button>
      <button onclick="switchTab('purchased')" id="tab-purchased" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
        Purchased
      </button>
      <button onclick="switchTab('transcended')" id="tab-transcended" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
        Transcended
      </button>
    </div>
  </header>

  <!-- Main Pin Masonry Display -->
  <main class="max-w-4xl mx-auto px-4 pt-4">
    <div id="pins-grid" class="masonry-grid"></div>
    <div id="empty-state" class="hidden text-center py-16 text-slate-400">
      <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
      <p id="empty-state-text" class="text-sm">No items in this state. The urge is sleeping.</p>
    </div>
  </main>

  <!-- Bottom Sticky Summary Bar -->
  <div class="fixed bottom-0 left-0 right-0 z-20 bg-white/95 backdrop-blur-md border-t border-slate-200 py-3 px-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between text-sm">
      <span id="bottom-summary-label" class="font-bold text-slate-700">Wishlist Total:</span>
      <div class="text-right">
        <span id="bottom-summary-val" class="font-black text-slate-900 text-base">$0.00</span>
        <div id="bottom-summary-subtext" class="text-[10px] text-slate-400">before taxes</div>
      </div>
    </div>
  </div>

  <!-- Entry / Edit Pin Modal Sheet -->
  <div id="pin-modal" class="fixed inset-0 z-40 hidden flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
      <!-- Modal Header -->
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-slate-800 text-base">Pin Something New</h3>
        <button onclick="requestDiscard()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Form Inputs -->
      <div class="p-4 overflow-y-auto space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Item Title *</label>
          <input type="text" id="pin-title" placeholder="What is your heart craving?" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Price ($) *</label>
            <input type="number" step="0.01" id="pin-price" placeholder="0.00" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Status</label>
            <select id="pin-status" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="wishlist">Wishlist (Desire)</option>
              <option value="purchased">Purchased (Consumed)</option>
              <option value="transcended">Transcended (Detached)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Product URL Link</label>
          <input type="url" id="pin-url" placeholder="https://" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <!-- Photo Selection: Upload Left, Link Right -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Image Options</label>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <label class="border border-slate-200 rounded-lg p-2.5 text-center cursor-pointer hover:bg-slate-50 transition-colors">
              <i class="fa-solid fa-upload text-indigo-600 mb-1 block"></i>
              <span class="text-xs font-bold text-slate-700">Upload Photo</span>
              <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)" />
            </label>
            <div class="border border-slate-200 rounded-lg p-2.5 text-center cursor-pointer hover:bg-slate-50 transition-colors" onclick="toggleLinkInput()">
              <i class="fa-solid fa-link text-indigo-600 mb-1 block"></i>
              <span class="text-xs font-bold text-slate-700">Paste Image Link</span>
            </div>
          </div>
          <input type="url" id="image-url-input" placeholder="Paste direct image link..." class="hidden w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-2" onchange="handleImageUrlInput(this.value)" />

          <!-- Cropper Container -->
          <div id="cropper-wrapper" class="hidden max-h-64 overflow-hidden rounded-lg bg-slate-900 mb-2">
            <img id="cropper-image" class="max-w-full" />
          </div>
          <button id="crop-btn" onclick="applyCrop()" class="hidden w-full py-1.5 bg-slate-800 text-white text-xs font-bold rounded-lg mb-2">Apply Freeform Crop</button>

          <!-- Image Preview -->
          <div id="preview-wrapper" class="hidden relative rounded-lg overflow-hidden border border-slate-200 max-h-48 flex justify-center bg-slate-100">
            <img id="image-preview" class="object-contain max-h-48" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Notes / Philosophical Musings</label>
          <textarea id="pin-notes" rows="2" placeholder="Why do you crave this earthly object?" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 flex gap-2">
        <button onclick="requestDiscard()" class="w-1/3 py-2.5 border border-slate-300 rounded-lg font-bold text-xs text-slate-600 hover:bg-slate-100">Cancel</button>
        <button onclick="savePin()" class="w-2/3 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold text-xs shadow-sm">Save Pin</button>
      </div>
    </div>
  </div>

  <!-- Pinterest-Style Full Screen Detail Zoom View Modal -->
  <div id="zoom-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4" onclick="closeZoomModal(event)">
    <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <div id="zoom-image-container" class="bg-slate-100 max-h-96 flex justify-center items-center overflow-hidden border-b border-slate-100">
        <img id="zoom-img" class="w-full object-cover max-h-96" />
      </div>
      <div class="p-5">
        <div class="flex items-start justify-between gap-2 mb-2">
          <h2 id="zoom-title" class="text-lg font-bold text-slate-900 leading-tight"></h2>
          <span id="zoom-price" class="text-lg font-black text-indigo-600"></span>
        </div>
        <p id="zoom-notes" class="text-xs text-slate-600 mb-4 italic"></p>
        
        <div class="flex flex-wrap gap-2 mb-4">
          <button onclick="updatePinState('wishlist')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700">Move to Wishlist</button>
          <button onclick="updatePinState('purchased')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-100 hover:bg-emerald-200 text-emerald-800">Move to Purchased</button>
          <button onclick="updatePinState('transcended')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-900 text-white">Transcend Item</button>
        </div>

        <div class="flex justify-between items-center border-t border-slate-100 pt-3">
          <a id="zoom-link" href="#" target="_blank" class="text-xs font-bold text-indigo-600 hover:underline flex items-center gap-1">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Visit Product Link
          </a>
          <button onclick="deleteActivePin()" class="text-xs font-bold text-rose-600 hover:text-rose-700 flex items-center gap-1">
            <i class="fa-solid fa-trash"></i> Delete Pin
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Discard Confirmation Overlay -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/40 p-4">
    <div class="bg-white rounded-xl p-5 max-w-xs w-full text-center space-y-3 shadow-xl">
      <h4 class="font-bold text-slate-800 text-sm">Discard changes?</h4>
      <p class="text-xs text-slate-500">Are you sure you want to discard this pin?</p>
      <div class="flex gap-2 pt-2">
        <button onclick="closeConfirmModal()" class="w-1/2 py-2 border border-slate-200 text-slate-600 rounded-lg text-xs font-bold">Keep Editing</button>
        <button onclick="confirmDiscard()" class="w-1/2 py-2 bg-rose-600 text-white rounded-lg text-xs font-bold">Discard</button>
      </div>
    </div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = "https://lmtbauyoljswgllakdzl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zfrAYBrFS-q3NGK6gC_W7Q_qZTZqUWO";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // State Variables
    let items = [];
    let activeTab = 'wishlist';
    let cropperInstance = null;
    let currentImageBase64 = '';
    let activePinId = null;

    // Toast Copy Pools (STRICT 2–7 WORDS)
    const COPY_POOLS = {
      wishlist: [
        "Desire persists.", "You still want this.", "What does this say?", "Your character is tested.",
        "Is this desire worth it?", "The economy wants this.", "The shareholders are watching.",
        "Capitalism has noticed you.", "Someone manufactured this desire.", "You were not born wanting this.",
        "Who benefits from your longing?", "The algorithm approves.", "You seek fulfillment. Interesting.",
        "Material desire detected.", "The craving remains.", "You are still tempted.",
        "Desire has entered the chat.", "The cart awaits.", "The object calls.", "You have been marketed to."
      ],
      purchased: [
        "BUY BUY BUY BUY.", "Spend spend spend.", "YES GIRL. SPEND.", "Consumption achieved.",
        "Purchase complete.", "Capitalism wins.", "The economy thanks you.", "Shareholders are thrilled.",
        "Economic activity detected.", "You acquired the object.", "Desire became possession.",
        "Your desire was monetized.", "Purchasing power activated.", "Money became merchandise.",
        "The cart has prevailed.", "Capitalism welcomes you.", "The system is pleased.", "A purchase has occurred."
      ],
      transcended: [
        "Desire...Transcended! - Darling", "Desire released.", "You chose freedom.", "You resisted.",
        "You walked away.", "Attachment dissolved.", "The desire passed.", "You are free.",
        "You have transcended.", "Desire acknowledged. Desire released.", "You chose detachment.",
        "Materialism defeated.", "The craving has passed.", "You survived temptation.", "Attachment: -1.",
        "Possession: avoided.", "Money: saved.", "Capitalism: resisted.", "The urge has passed.",
        "You leave empty-handed.", "Enlightenment achieved.", "Earthly desire: denied.", "The object is released."
      ],
      relapse: [
        "Oh… you’re doing this again?", "You were free.", "You were doing so well.", "What happened?",
        "Wasn’t liberation nice?", "Your liberation was temporary.", "Enlightenment postponed.",
        "You have returned to desire.", "The desire has returned.", "Attachment has returned.",
        "You chose to want again.", "You reopened the door.", "The material world welcomes you.",
        "Capitalism welcomes you back.", "The cart awaits.", "The corporation remembers you.",
        "The algorithm called you back.", "Attachment re-entered the chat.", "We literally transcended this.",
        "Girl. We just left.", "You were FREE.", "And yet, you returned.", "The craving returns.",
        "Transcendence has failed.", "The shareholders are pleased."
      ]
    };

    // App Initialization
    window.addEventListener('DOMContentLoaded', async () => {
      await fetchItems();
    });

    async function fetchItems() {
      const { data, error } = await db.from('items').select('*').order('created_at', { ascending: false });
      if (!error && data) {
        items = data;
        renderGrid();
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200';
      });
      document.getElementById(`tab-${tab}`).className = 'tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-900 text-white';
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('pins-grid');
      const emptyState = document.getElementById('empty-state');
      grid.innerHTML = '';

      const filtered = items.filter(item => item.status === activeTab);

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'break-inside-avoid mb-4 bg-white rounded-xl overflow-hidden shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-all';
          card.onclick = () => openZoomModal(item);

          card.innerHTML = `
            ${item.image_url ? `<img src="${item.image_url}" class="w-full object-cover" />` : ''}
            <div class="p-3">
              <h4 class="font-bold text-slate-800 text-xs line-clamp-2">${item.title}</h4>
              <div class="flex justify-between items-center mt-2">
                <span class="text-xs font-black text-indigo-600">$${parseFloat(item.price || 0).toFixed(2)}</span>
                <span class="text-[10px] font-bold text-slate-400 capitalize">${item.status}</span>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }
      updateBudgetSummaries();
    }

    function updateBudgetSummaries() {
      const filtered = items.filter(item => item.status === activeTab);
      const sum = filtered.reduce((acc, curr) => acc + (parseFloat(curr.price) || 0), 0);
      const formattedSum = `$${sum.toFixed(2)}`;

      const topVal = document.getElementById('top-total-val');
      const topSub = document.getElementById('top-subtext');
      const botLabel = document.getElementById('bottom-summary-label');
      const botVal = document.getElementById('bottom-summary-val');
      const botSub = document.getElementById('bottom-summary-subtext');

      if (activeTab === 'wishlist') {
        topVal.innerText = formattedSum;
        topSub.innerText = '(before taxes)';
        botLabel.innerText = 'Wishlist Total:';
        botVal.innerText = formattedSum;
        botSub.innerText = 'before taxes';
      } else if (activeTab === 'purchased') {
        topVal.innerText = formattedSum;
        topSub.innerText = '(spent in total)';
        botLabel.innerText = 'Total Consumed:';
        botVal.innerText = formattedSum;
        botSub.innerText = 'spent in total';
      } else if (activeTab === 'transcended') {
        topVal.innerText = formattedSum;
        topSub.innerText = '(saved through detachment)';
        botLabel.innerText = 'Saved Through Detachment:';
        botVal.innerText = formattedSum;
        botSub.innerText = 'Your wallet has attained liberation.';
      }
    }

    // Modal Control & Cleansing Logic
    function openPinModal() {
      resetModalForm();
      document.getElementById('pin-modal').classList.remove('hidden');
    }

    function requestDiscard() {
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
    }

    function confirmDiscard() {
      closeConfirmModal();
      resetModalForm();
      document.getElementById('pin-modal').classList.add('hidden');
    }

    function resetModalForm() {
      document.getElementById('pin-title').value = '';
      document.getElementById('pin-price').value = '';
      document.getElementById('pin-url').value = '';
      document.getElementById('pin-notes').value = '';
      document.getElementById('pin-status').value = activeTab;
      document.getElementById('file-input').value = '';
      document.getElementById('image-url-input').value = '';
      document.getElementById('image-url-input').classList.add('hidden');
      document.getElementById('preview-wrapper').classList.add('hidden');
      document.getElementById('crop-btn').classList.add('hidden');
      document.getElementById('cropper-wrapper').classList.add('hidden');
      currentImageBase64 = '';
      if (cropperInstance) {
        cropperInstance.destroy();
        cropperInstance = null;
      }
    }

    // Image Uploading & Freeform Cropping
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => initCropper(event.target.result);
        reader.readAsDataURL(file);
      }
    }

    function toggleLinkInput() {
      const input = document.getElementById('image-url-input');
      input.classList.toggle('hidden');
    }

    function handleImageUrlInput(val) {
      if (val) initCropper(val);
    }

    function initCropper(src) {
      const wrapper = document.getElementById('cropper-wrapper');
      const img = document.getElementById('cropper-image');
      wrapper.classList.remove('hidden');
      document.getElementById('crop-btn').classList.remove('hidden');
      img.src = src;

      if (cropperInstance) cropperInstance.destroy();
      cropperInstance = new Cropper(img, {
        aspectRatio: NaN, // Freeform aspect ratio
        viewMode: 1
      });
    }

    function applyCrop() {
      if (!cropperInstance) return;
      const canvas = cropperInstance.getCroppedCanvas();
      currentImageBase64 = canvas.toDataURL('image/jpeg');
      
      document.getElementById('cropper-wrapper').classList.add('hidden');
      document.getElementById('crop-btn').classList.add('hidden');
      
      const previewWrapper = document.getElementById('preview-wrapper');
      const previewImg = document.getElementById('image-preview');
      previewImg.src = currentImageBase64;
      previewWrapper.classList.remove('hidden');
    }

    // Pin Persistence & State Transitions
    async function savePin() {
      const title = document.getElementById('pin-title').value.trim();
      const price = parseFloat(document.getElementById('pin-price').value) || 0;
      const status = document.getElementById('pin-status').value;
      const link_url = document.getElementById('pin-url').value.trim();
      const notes = document.getElementById('pin-notes').value.trim();

      if (!title) return alert('Title is required!');

      const newItem = {
        title,
        price,
        status,
        link_url,
        notes,
        image_url: currentImageBase64
      };

      const { data, error } = await db.from('items').insert([newItem]).select();
      if (!error && data) {
        items.unshift(data[0]);
        triggerToast(status);
        confirmDiscard();
        renderGrid();
      }
    }

    // Full-Screen Zoom Modal
    function openZoomModal(item) {
      activePinId = item.id;
      document.getElementById('zoom-img').src = item.image_url || '';
      document.getElementById('zoom-title').innerText = item.title;
      document.getElementById('zoom-price').innerText = `$${parseFloat(item.price || 0).toFixed(2)}`;
      document.getElementById('zoom-notes').innerText = item.notes ? `"${item.notes}"` : '';
      document.getElementById('zoom-link').href = item.link_url || '#';
      document.getElementById('zoom-modal').classList.remove('hidden');
    }

    function closeZoomModal(e) {
      document.getElementById('zoom-modal').classList.add('hidden');
      activePinId = null;
    }

    async function updatePinState(newStatus) {
      if (!activePinId) return;
      const item = items.find(i => i.id === activePinId);
      if (!item) return;

      const previousStatus = item.status;
      item.status = newStatus;

      await db.from('items').update({ status: newStatus }).eq('id', activePinId);

      // Trigger narrative punchline if falling back from Transcended to Wishlist
      if (previousStatus === 'transcended' && newStatus === 'wishlist') {
        triggerToast('relapse');
      } else {
        triggerToast(newStatus);
      }

      closeZoomModal();
      renderGrid();
    }

    async function deleteActivePin() {
      if (!activePinId) return;
      await db.from('items').delete().eq('id', activePinId);
      items = items.filter(i => i.id !== activePinId);
      closeZoomModal();
      renderGrid();
    }

    // Toast System (Random Selection)
    function triggerToast(type) {
      const container = document.getElementById('toast-container');
      const pool = COPY_POOLS[type] || COPY_POOLS.wishlist;
      const message = pool[Math.floor(Math.random() * pool.length)];

      const toast = document.createElement('div');
      toast.className = 'toast-enter bg-slate-900/90 backdrop-blur-md text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg border border-slate-700/50 text-center';
      toast.innerText = message;

      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
