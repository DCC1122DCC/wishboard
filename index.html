<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="icons/logo.png">
<link rel="apple-touch-icon" href="icons/logo.png">
<meta property="og:image" content="icons/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wishboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Baloo+2:wght@500;600;700&family=Archivo+Black&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.3/cropper.min.css" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  .wb-root {
    /* ---- color tokens (Original / Quiet-Luxury Editorial defaults) ---- */
    --paper: #F6F3EC;
    --ink: #1C1A17;
    --muted: #8C877C;
    --plum: #1C1A17;
    --gold: #A9814A;
    --sage: #5E6B57;
    --zen: #55606B;
    --line: #E3DED2;
    --card: #FFFFFF;

    /* ---- shape / elevation / type tokens ---- */
    --radius-card: 6px;
    --radius-tab: 4px;
    --radius-sheet: 10px;
    --radius-btn: 6px;
    --radius-small: 4px;
    --radius-field: 6px;
    --radius-auth: 10px;
    --shadow-card: 0 1px 3px rgba(20,18,14,.06);
    --shadow-fab: 0 6px 16px rgba(20,18,14,.28);
    --shadow-auth: 0 10px 26px rgba(20,18,14,.08);
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --x-color: #B7B2A6;
    --delete-bg: rgba(178,42,42,.88);
    --delete-bg-hover: rgba(150,32,32,.95);

    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 100px;
    box-sizing: border-box;
  }
  .wb-root *, .wb-root *::before, .wb-root *::after { box-sizing: border-box; }

  /* ============== HYPER-CONSUMERIST (glossy bevels, gradients) ============== */
  .wb-root[data-theme="absurdist"] {
    --paper: #F2F2F2; --ink: #111111; --muted: #6B6B6B; --plum: #FF2D78; --gold: #FFD600;
    --sage: #00C853; --zen: #2979FF; --line: #E0E0E0; --card: #FFFFFF;
    --radius-card: 6px; --radius-tab: 4px; --radius-sheet: 10px; --radius-btn: 8px;
    --radius-small: 4px; --radius-field: 6px; --radius-auth: 10px;
    --shadow-card: 3px 3px 0 rgba(0,0,0,.9); --shadow-fab: 0 6px 0 rgba(0,0,0,.85), 0 10px 20px rgba(0,0,0,.3); --shadow-auth: 6px 6px 0 rgba(0,0,0,.85);
    --font-display: 'Archivo Black', sans-serif; --font-body: 'Space Grotesk', sans-serif;
    --x-color: #BDBDBD;
  }
  .wb-root[data-theme="absurdist"] .wb-card { border: 2px solid var(--ink); }
  .wb-root[data-theme="absurdist"] .wb-fab {
    border: 2px solid var(--ink); background: linear-gradient(160deg, #FF6FA1 0%, var(--plum) 55%, #C4005E 100%);
  }
  .wb-root[data-theme="absurdist"] .wb-save-btn,
  .wb-root[data-theme="absurdist"] .wb-autofill-btn {
    background: linear-gradient(160deg, #FF6FA1 0%, var(--plum) 60%, #C4005E 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 4px rgba(0,0,0,.25), 0 3px 0 rgba(0,0,0,.85);
    border: 2px solid var(--ink);
  }
  .wb-root[data-theme="absurdist"] .wb-btn-move.to-purchased { background: linear-gradient(160deg, #6CFFB0 0%, var(--sage) 65%, #009624 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 rgba(0,0,0,.7); border: 2px solid var(--ink); }
  .wb-root[data-theme="absurdist"] .wb-btn-move.to-transcended { background: linear-gradient(160deg, #7DB1FF 0%, var(--zen) 65%, #0039CB 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 rgba(0,0,0,.7); border: 2px solid var(--ink); }
  .wb-root[data-theme="absurdist"] .wb-price-tag { background: linear-gradient(160deg, #FFEA6E 0%, var(--gold) 65%, #C7A400 100%); color: #111; box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 3px 8px rgba(0,0,0,.3); }

  .wb-ticker { overflow: hidden; background: var(--ink); color: var(--gold); border-bottom: 2px solid var(--ink); }
  .wb-ticker-track { display: flex; white-space: nowrap; width: max-content; animation: wb-ticker-scroll 18s linear infinite; }
  .wb-ticker-track span { padding: 6px 0; font-family: var(--font-body); font-weight: 700; font-size: 12px; letter-spacing: .04em; }
  @keyframes wb-ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ============== SURREALIST (cream / sky-blue / butter-yellow / coral) ============== */
  .wb-root[data-theme="surreal"] {
    --paper: #F2DFAE; --ink: #2B1B0E; --muted: #8A6A3D; --plum: #0E7C93; --gold: #C97A2B;
    --sage: #1E9EC2; --zen: #D9622E; --line: rgba(120,70,20,.3); --card: #FFF6E6;
    --radius-card: 26px; --radius-tab: 18px; --radius-sheet: 30px; --radius-btn: 20px;
    --radius-small: 14px; --radius-field: 16px; --radius-auth: 26px;
    --shadow-card: 16px 20px 0 -4px rgba(180,90,30,.28), 30px 34px 46px -10px rgba(14,90,110,.32);
    --shadow-fab: 0 12px 26px rgba(201,122,43,.45); --shadow-auth: 0 16px 34px rgba(14,90,110,.22);
    --font-display: 'Fraunces', serif; --font-body: 'Space Grotesk', sans-serif;
    --x-color: #B08655;
  }
  /* Dynamic, multi-stop "Persistence of Memory" atmosphere: intense Catalan
     azure/cyan sky, a hazy horizon band, then deep burnt-sienna/ochre sand. */
  .wb-root[data-theme="surreal"] {
    background:
      radial-gradient(ellipse 55% 32% at 78% 16%, rgba(255,233,180,.55) 0%, rgba(255,233,180,0) 62%),
      linear-gradient(180deg,
        #0A4A66 0%,
        #0F6C87 13%,
        #1D93AC 24%,
        #55BAC9 33%,
        #CFE4D6 43%,
        #ECDBA0 51%,
        #DFB569 63%,
        #C4863E 76%,
        #8C5323 90%,
        #55301A 100%);
    background-attachment: fixed;
  }
  .wb-root[data-theme="surreal"] .wb-card {
    border-radius: 38% 62% 41% 59% / 24% 46% 54% 76%;
    transition: transform .4s ease, box-shadow .4s ease, border-radius .4s ease;
  }
  .wb-root[data-theme="surreal"] .wb-card:nth-of-type(3n) { transform: rotate(1deg); }
  .wb-root[data-theme="surreal"] .wb-card:nth-of-type(4n) { transform: rotate(-1.3deg); }
  .wb-root[data-theme="surreal"] .wb-card:nth-of-type(5n) { transform: rotate(0.6deg); }
  .wb-root[data-theme="surreal"] .wb-card:hover {
    transform: translateY(-7px) rotate(0deg) scale(1.015);
    border-radius: 55% 45% 62% 38% / 40% 60% 35% 65%;
    box-shadow: 22px 30px 0 -6px rgba(180,90,30,.32), 40px 50px 62px -10px rgba(14,90,110,.4);
  }
  .wb-root[data-theme="surreal"] .wb-title { font-size: 40px; letter-spacing: -0.01em; }
  .wb-root[data-theme="surreal"] .wb-sheet h2,
  .wb-root[data-theme="surreal"] .wb-detail-title { font-style: italic; }
  .wb-root[data-theme="surreal"] .wb-tab { background: #E9CE96; }
  .wb-root[data-theme="surreal"] .wb-tab.active-wishlist { border-radius: 30px 8px 0 0; }
  .wb-root[data-theme="surreal"] .wb-tab.active-purchased { border-radius: 10px 26px 0 0; }
  .wb-root[data-theme="surreal"] .wb-tab.active-transcended { border-radius: 24px 14px 0 0; }
  .wb-root[data-theme="surreal"] .wb-tab.active-custom { border-radius: 16px 24px 0 0; }
  .wb-root[data-theme="surreal"] .wb-imgwrap img {
    filter: sepia(.35) saturate(1.55) contrast(1.1);
    transition: filter .35s ease;
  }
  .wb-root[data-theme="surreal"] .wb-imgwrap:hover img { filter: none; }
  /* liquid, drippy price tag + delete button — dream-logic blobs instead of pills/circles */
  .wb-root[data-theme="surreal"] .wb-price-tag {
    border-radius: 42% 58% 54% 46% / 62% 44% 56% 38%;
    transform: rotate(-3deg);
    background: linear-gradient(140deg, #E7AE55 0%, var(--gold) 55%, #935318 100%);
    box-shadow: 0 4px 10px rgba(90,50,10,.35);
  }
  .wb-root[data-theme="surreal"] .wb-delete.wb-delete-quiet {
    border-radius: 38% 62% 55% 45% / 55% 40% 60% 45%;
  }

  .wb-badge {
    display: inline-block; background: var(--gold); color: #111; font-family: var(--font-display);
    font-size: 10px; letter-spacing: .03em; padding: 3px 7px; border-radius: 3px; margin-left: 8px; vertical-align: middle;
  }
  .wb-badge-corner { position: absolute; top: 8px; left: 8px; z-index: 2; margin-left: 0; }
  .wb-microcopy { font-size: 11px; font-style: italic; color: var(--muted); margin: 4px 0 0; }

  .wb-header { padding: 26px 20px 0; }
  .wb-title { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 30px; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
  .wb-title-logo { display: inline-flex; align-items: center; color: var(--gold); }
  .wb-subtitle { font-size: 13px; color: var(--muted); margin: 5px 0 0; }

  .wb-header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .wb-header-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-top: 4px; }
  .wb-header-actions-row { display: flex; align-items: center; gap: 8px; }
  .wb-logout {
    background: none; border: 1px solid var(--line); color: var(--muted); padding: 7px 12px;
    border-radius: var(--radius-small); font-size: 12px; cursor: pointer; font-family: var(--font-body);
    white-space: nowrap;
  }
  .wb-header-meta { text-align: right; }
  .wb-header-meta p { margin: 0; font-size: 10px; color: var(--muted); opacity: .8; line-height: 1.6; }

  .wb-theme-switcher { position: relative; }
  .wb-theme-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted);
  }
  .wb-theme-menu {
    position: absolute; top: 40px; right: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px; box-shadow: 0 10px 24px rgba(0,0,0,.15); z-index: 30; min-width: 172px;
  }
  .wb-theme-option {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: none; background: none;
    border-radius: 8px; cursor: pointer; font-family: var(--font-body); font-size: 12.5px; color: var(--ink); text-align: left;
  }
  .wb-theme-option:hover, .wb-theme-option.active { background: var(--paper); font-weight: 600; }
  .wb-theme-swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.12); flex: none; }

  .wb-tabs { display: flex; gap: 6px; margin: 22px 20px 0; flex-wrap: wrap; align-items: flex-end; }
  .wb-tab {
    padding: 10px 14px 12px; border-radius: var(--radius-tab) var(--radius-tab) 0 0; font-size: 13.5px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--line); border-bottom: none; background: #ECE8DF; color: var(--muted);
    transition: background .15s, color .15s; position: relative;
  }
  .wb-root[data-theme="absurdist"] .wb-tab { background: #E6E6E6; }
  .wb-root[data-theme="surreal"] .wb-tab { background: #F1E8D6; }
  .wb-tab .wb-count { margin-left: 6px; font-size: 11.5px; opacity: .65; }
  .wb-tab.active-wishlist { background: var(--card); color: var(--plum); box-shadow: 0 -3px 0 var(--plum) inset; }
  .wb-tab.active-purchased { background: var(--card); color: var(--sage); box-shadow: 0 -3px 0 var(--sage) inset; }
  .wb-tab.active-transcended { background: var(--card); color: var(--zen); box-shadow: 0 -3px 0 var(--zen) inset; }
  .wb-tab.active-custom { background: var(--card); color: var(--gold); box-shadow: 0 -3px 0 var(--gold) inset; padding-right: 28px; }
  .wb-tab-delete {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: inherit; cursor: pointer; display: flex; opacity: .7;
  }
  .wb-tab-delete:hover { opacity: 1; }
  .wb-tab-dragover {
    box-shadow: 0 0 0 2px var(--plum) inset, 0 -3px 0 var(--plum) inset !important;
    background: var(--card) !important;
  }
  .wb-tab-add {
    padding: 10px 12px 12px; border-radius: var(--radius-tab) var(--radius-tab) 0 0; border: 1px dashed var(--line); border-bottom: none;
    background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center;
  }
  .wb-tabline { height: 1px; background: var(--line); margin: 0 20px; }

  .wb-summary-sticky {
    position: sticky; top: 0; z-index: 15; background: var(--paper);
    margin: 0; padding: 10px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .wb-summary-sticky .wb-summary-label { font-size: 12px; }
  .wb-summary-sticky .wb-summary-total { font-size: 18px; }
  .wb-summary-sticky-caption { font-size: 10px; color: var(--muted); margin: 0; }

  .wb-grid { column-count: 2; column-gap: 14px; padding: 18px 20px 0; }
  @media (min-width: 640px) { .wb-grid { column-count: 3; } }
  @media (min-width: 960px) { .wb-grid { column-count: 4; } }

  .wb-card { break-inside: avoid; margin-bottom: 14px; background: var(--card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; border: 1px solid var(--line); position: relative; transition: transform .25s ease, box-shadow .25s ease; }
  .wb-card[draggable="true"] { cursor: grab; }
  .wb-card:active { cursor: grabbing; }
  .wb-imgwrap { position: relative; background: #ECE4D2; cursor: pointer; }
  .wb-imgwrap img { width: 100%; display: block; object-fit: cover; }
  .wb-placeholder { width: 100%; aspect-ratio: 4 / 5; background: linear-gradient(160deg, var(--plum), #7d5468); display: flex; align-items: center; justify-content: center; }
  .wb-placeholder span { font-family: var(--font-display); font-size: 46px; color: rgba(255,255,255,.85); }

  .wb-price-tag {
    position: absolute; bottom: -12px; left: 10px; background: var(--gold); color: #fff; font-weight: 700;
    font-size: 12.5px; padding: 5px 10px; border-radius: var(--radius-small); box-shadow: 0 3px 8px rgba(0,0,0,.2);
    font-variant-numeric: tabular-nums;
  }
  .wb-delete {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--delete-bg); color: #fff; border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2; transition: background .15s;
  }
  .wb-delete:hover { background: var(--delete-bg-hover); }
  .wb-delete.wb-delete-quiet {
    background: rgba(255,255,255,.85); color: var(--x-color); box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .wb-delete.wb-delete-quiet:hover { background: #fff; color: var(--muted); }

  .wb-body { padding: 20px 12px 12px; }
  .wb-item-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; margin: 0 0 4px; }
  .wb-item-source {
    font-size: 11px; color: var(--muted); margin: 0 0 12px; display: block; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wb-item-source[href] { color: #7d6a8f; }

  .wb-item-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .wb-btn-move {
    font-family: var(--font-body); font-size: 11.5px; font-weight: 600; padding: 7px 8px;
    border-radius: var(--radius-small); border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    flex: 1; justify-content: center; min-width: 0;
  }
  .wb-btn-move.to-purchased { background: var(--sage); color: #fff; }
  .wb-btn-move.to-transcended { background: var(--zen); color: #fff; }
  .wb-btn-move.to-wishlist { background: #EDE6D6; color: var(--ink); flex: 1 1 100%; }

  .wb-summary { margin: 8px 20px 0; padding: 20px 4px 4px; border-top: 2px dashed var(--line); }
  .wb-summary-row { display: flex; align-items: baseline; justify-content: space-between; }
  .wb-summary-label { font-size: 13px; color: var(--muted); }
  .wb-summary-total { font-family: var(--font-display); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; }
  .wb-summary-total.wishlist { color: var(--plum); }
  .wb-summary-total.purchased { color: var(--sage); }
  .wb-summary-total.transcended { color: var(--zen); }
  .wb-summary-caption { font-size: 12px; color: var(--muted); margin: 4px 0 0; font-style: italic; }

  .wb-empty { margin: 56px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }

  .wb-fab {
    position: fixed; right: 20px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--plum); color: #fff; border: none; box-shadow: var(--shadow-fab);
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 25;
  }

  .wb-overlay { position: fixed; inset: 0; background: rgba(30,26,22,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 40; }
  .wb-sheet { position: relative; background: var(--paper); width: 100%; max-width: 480px; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 18px 20px 28px; max-height: 88vh; overflow-y: auto; }
  .wb-sheet-handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 16px; touch-action: none; }
  .wb-sheet h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0 0 16px; }
  .wb-draft-hint { font-size: 11.5px; color: var(--muted); margin: -10px 0 14px; font-style: italic; }
  .wb-close-x { position: absolute; top: 14px; right: 16px; background: none; border: none; cursor: pointer; color: var(--x-color); z-index: 3; }
  .wb-field { margin-bottom: 14px; }
  .wb-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .wb-field input {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-field); border: 1px solid var(--line);
    font-family: var(--font-body); font-size: 14px; background: #fff; color: var(--ink);
  }
  .wb-field textarea {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-field); border: 1px solid var(--line);
    font-family: var(--font-body); font-size: 14px; background: #fff; color: var(--ink);
    resize: vertical; min-height: 70px;
  }
  .wb-imgmode { display: flex; gap: 8px; margin-bottom: 10px; }
  .wb-imgmode button { flex: 1; padding: 9px; border-radius: var(--radius-small); border: 1px solid var(--line); background: #fff; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--ink); }
  .wb-imgmode button.active { background: var(--plum); color: #fff; border-color: var(--plum); }
  .wb-preview { width: 100%; height: 130px; border-radius: var(--radius-field); object-fit: cover; margin-top: 8px; border: 1px solid var(--line); }
  .wb-save-btn { width: 100%; padding: 13px; border-radius: var(--radius-btn); border: none; background: var(--plum); color: #fff; font-weight: 700; font-size: 14.5px; cursor: pointer; margin-top: 4px; font-family: var(--font-body); }
  .wb-save-btn:disabled { opacity: .45; cursor: not-allowed; }

  .wb-mini-preview { max-width: 190px; pointer-events: none; }
  .wb-mini-preview .wb-body { padding: 16px 10px 10px; }

  .wb-sheet-actions { display: flex; gap: 8px; margin-top: 4px; }
  .wb-sheet-actions .wb-save-btn { flex: 2; margin-top: 0; }
  .wb-cancel-btn {
    flex: 1; padding: 13px; border-radius: var(--radius-btn); border: 1px solid var(--line); background: #fff;
    color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: var(--font-body);
  }

  .wb-root.wb-auth { padding-bottom: 0; display: flex; align-items: center; justify-content: center; }
  .wb-auth-card {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-auth); padding: 30px 26px; box-shadow: var(--shadow-auth); margin: 24px;
  }
  .wb-auth-tabs { display: flex; gap: 6px; margin: 22px 0 20px; border-bottom: 1px solid var(--line); }
  .wb-auth-tabs button {
    flex: 1; padding: 10px; background: none; border: none; font-family: var(--font-body);
    font-weight: 600; font-size: 13.5px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .wb-auth-tabs button.active { color: var(--plum); border-bottom-color: var(--plum); }
  .wb-auth-error { font-size: 12.5px; color: #a2453c; margin: -4px 0 12px; line-height: 1.5; }
  .wb-auth-notice { font-size: 12.5px; color: var(--sage); margin: -4px 0 12px; line-height: 1.5; }

  .wb-link-row { display: flex; gap: 8px; }
  .wb-link-row input { flex: 1; }
  .wb-autofill-btn {
    padding: 0 14px; border-radius: var(--radius-field); border: none; background: var(--plum); color: #fff;
    font-weight: 600; font-size: 12.5px; cursor: pointer; font-family: var(--font-body);
    white-space: nowrap;
  }
  .wb-autofill-btn:disabled { opacity: .5; cursor: not-allowed; }

// --- link auto-fill: pull og:title / og:image / price out of a product page ---
// Most shopping sites don't allow direct cross-origin fetches, so this tries the
// real URL first, then falls back to a public CORS proxy. Best-effort only —
// the proxy is a free third-party service that can rate-limit or go down.
function parseMetaFromHtml(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const getMeta = (prop) => {
    const el = doc.querySelector(`meta[property="${prop}"]`) || doc.querySelector(`meta[name="${prop}"]`);
    return el ? (el.getAttribute("content") || "").trim() : "";
  };

  const title = getMeta("og:title") || (doc.querySelector("title")?.textContent || "").trim();
  const image = getMeta("og:image") || getMeta("og:image:url") || getMeta("twitter:image");

  let price = getMeta("product:price:amount") || getMeta("og:price:amount");

  if (!price) {
    const priceEl = doc.querySelector('[itemprop="price"]');
    if (priceEl) price = priceEl.getAttribute("content") || priceEl.textContent || "";
  }

  if (!price) {
    const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
    for (const s of scripts) {
      try {
        const data = JSON.parse(s.textContent);
        const candidates = Array.isArray(data) ? data : [data];
        for (const item of candidates) {
          const graph = item["@graph"] || [item];
          for (const node of graph) {
            const offers = node && node.offers;
            if (offers) {
              const offer = Array.isArray(offers) ? offers[0] : offers;
              if (offer && offer.price) { price = offer.price; break; }
            }
          }
          if (price) break;
        }
      } catch {
        // not valid JSON-LD — skip it
      }
      if (price) break;
    }
  }

  return {
    title: title || "",
    image: image || "",
    price: price ? String(price).replace(/[^0-9.]/g, "") : "",
  };
}

async function fetchProductDetails(rawUrl) {
  const url = rawUrl.startsWith("http") ? rawUrl : `https://${rawUrl}`;
  const timeoutSignal = () =>
    typeof AbortSignal !== "undefined" && AbortSignal.timeout ? AbortSignal.timeout(9000) : undefined;

  const attempts = [url, `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`];

  let lastError = new Error("Couldn't fetch that link.");
  for (const attemptUrl of attempts) {
    try {
      const res = await fetch(attemptUrl, { signal: timeoutSignal() });
      if (!res.ok) throw new Error("Request failed");
      const html = await res.text();
      const meta = parseMetaFromHtml(html);
      if (meta.title || meta.image || meta.price) return meta;
      lastError = new Error("No usable details found on that page.");
    } catch (err) {
      lastError = err;
    }
  }
  throw lastError;
}

function useWishboardData(userId) {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    if (!userId) { setItems([]); setLoaded(true); return; }
    let cancelled = false;
    setLoaded(false);
    supabaseClient
      .from("items")
      .select("*")
      .eq("user_id", userId)
      .order("added_at", { ascending: false })
      .then(({ data, error }) => {
        if (cancelled) return;
        if (!error && data) setItems(data);
        setLoaded(true);
      });
    return () => { cancelled = true; };
  }, [userId]);

  const addItem = useCallback(async (item) => {
    const { data, error } = await supabaseClient
      .from("items")
      .insert({ ...item, user_id: userId })
      .select()
      .single();
    if (error) throw error;
    setItems((prev) => [data, ...prev]);
  }, [userId]);

  const deleteItem = useCallback(async (id) => {
    const prevItems = items;
    setItems((prev) => prev.filter((i) => i.id !== id)); // optimistic
    const { error } = await supabaseClient.from("items").delete().eq("id", id);
    if (error) {
      setItems(prevItems); // roll back if the server delete actually failed
      alert("Couldn't delete that item — please try again.");
    }
  }, [items]);

  const updateItem = useCallback(async (id, patch) => {
    const prevItems = items;
    setItems((prev) => prev.map((i) => (i.id === id ? { ...i, ...patch } : i))); // optimistic
    const { error } = await supabaseClient.from("items").update(patch).eq("id", id);
    if (error) {
      setItems(prevItems);
      alert("Couldn't save that change — please try again.");
    }
  }, [items]);

  const moveItem = useCallback(
    (id, status) => {
      const patch = {
        status,
        custom_tab_id: null,
        purchased_at: status === "purchased" ? new Date().toISOString() : null,
      };
      return updateItem(id, patch);
    },
    [updateItem]
  );

  return { items, addItem, deleteItem, moveItem, updateItem, loaded };
}

    const { data, error } = await supabaseClient
      .from("tabs")
      .insert({ user_id: userId, name })
      .select()
      .single();
    if (error) throw error;
    setTabs((prev) => [...prev, data]);
    return data;
  }, [userId]);

  const deleteTab = useCallback(async (id) => {
    setTabs((prev) => prev.filter((t) => t.id !== id));
    await supabaseClient.from("tabs").delete().eq("id", id);
  }, []);

  return { tabs, addTab, deleteTab };
}

function PriceTag({ value }) {
  return <div className="wb-price-tag">{currency(value)}</div>;
}

function ItemCard({ item, onMove, onDelete, onOpen, theme }) {
  const [imgError, setImgError] = useState(false);
  const initial = (item.title || "?").trim().charAt(0).toUpperCase();

  const handleDelete = (e) => {
    e.stopPropagation();
    if (window.confirm(`Delete "${item.title}"? This can't be undone.`)) {
      onDelete(item.id);
    }
  };

  // Drag source for tab-header drop targets (see wb-tabs in Wishboard).
  const handleDragStart = (e) => {
    e.dataTransfer.setData("text/plain", item.id);
    e.dataTransfer.effectAllowed = "move";
  };

  const badgeText = item.status === "wishlist" ? "WANT" : item.status === "purchased" ? "OWNED" : "RELEASED";
  // Red trash is a Consumerist-only accent; Original and Dali get a quiet gray X.
  const isQuietDelete = theme !== "absurdist";

  return (
    <div className="wb-card" draggable="true" onDragStart={handleDragStart}>
      <button
        className={`wb-delete ${isQuietDelete ? "wb-delete-quiet" : ""}`}
        onClick={handleDelete}
        aria-label="Delete item"
      >
        {isQuietDelete ? <XIcon size={14} /> : <TrashIcon size={13} />}
      </button>
      <div className="wb-imgwrap" onClick={() => onOpen(item)}>
        {theme === "absurdist" ? <span className="wb-badge wb-badge-corner">{badgeText}</span> : null}
        {item.image && !imgError ? (
          <img src={item.image} alt={item.title} onError={() => setImgError(true)} />
        ) : (
          <div className="wb-placeholder"><span>{initial}</span></div>
        )}
        <PriceTag value={item.price} />
      </div>
      <div className="wb-body">
        <p className="wb-item-title">{item.title}</p>
        {item.link ? (
          <a className="wb-item-source" href={item.link} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()}>
            {hostnameOf(item.link) || "view item"}
          </a>
        ) : (
          <p className="wb-item-source">&nbsp;</p>
        )}
        <div className="wb-item-actions">
          {item.status === "wishlist" && !item.custom_tab_id ? (
            <>
              <button className="wb-btn-move to-purchased" onClick={() => onMove(item.id, "purchased")}>
                <BagIcon size={13} /> Purchased
              </button>
              <button className="wb-btn-move to-transcended" onClick={() => onMove(item.id, "transcended")}>
                <LotusIcon size={13} /> Transcend
              </button>
            </>
          ) : (
            <button className="wb-btn-move to-wishlist" onClick={() => onMove(item.id, "wishlist")}>
              <UndoIcon size={13} /> Move back
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function EditPinFields({ item, onChange }) {
  // Inline edit form used inside the pin detail sheet — reuses the same
  // field set as pin creation, but patches the existing record.
  return (
    <>
      <div className="wb-field">
        <label>What is it?</label>
        <input type="text" value={item.title || ""} onChange={(e) => onChange({ title: e.target.value })} />
      </div>
      <div className="wb-field">
        <label>Price</label>
        <input
          type="number" inputMode="decimal" step="0.01" min="0"
          value={item.price ?? ""}
          onChange={(e) => onChange({ price: e.target.value })}
        />
      </div>
      <div className="wb-field">
        <label>Link to the product</label>
        <input type="text" value={item.link || ""} onChange={(e) => onChange({ link: e.target.value })} />
      </div>
      <div className="wb-field">
        <label>Image URL</label>
        <input type="text" value={item.image || ""} onChange={(e) => onChange({ image: e.target.value })} />
      </div>
    </>
  );
}

function PinDetailModal({ item, tabs, onClose, onMoveStatus, onMoveCustomTab, onDelete, onSaveNotes, onSaveEdits }) {
  const [notes, setNotes] = useState(item.notes || "");
  const [savingNotes, setSavingNotes] = useState(false);
  const [dragY, setDragY] = useState(0);
  const dragStartRef = useRef(null);
  const [editing, setEditing] = useState(false);
  const [draftItem, setDraftItem] = useState(item);
  const [savingEdits, setSavingEdits] = useState(false);

  useEffect(() => {
    setNotes(item.notes || "");
    setDraftItem(item);
  }, [item.id]);

  const handleNotesBlur = async () => {
    if (notes === (item.notes || "")) return;
    setSavingNotes(true);
    await onSaveNotes(item.id, notes);
    setSavingNotes(false);
  };

  const handleDelete = () => {
    if (window.confirm(`Delete "${item.title}"? This can't be undone.`)) {
      onDelete(item.id);
      onClose();
    }
  };

  const startEditing = () => { setDraftItem(item); setEditing(true); };
  const cancelEditing = () => { setDraftItem(item); setEditing(false); };
  const saveEditing = async () => {
    setSavingEdits(true);
    try {
      await onSaveEdits(item.id, {
        title: (draftItem.title || "").trim(),
        price: parseFloat(draftItem.price) || 0,
        link: (draftItem.link || "").trim(),
        image: (draftItem.image || "").trim(),
      });
      setEditing(false);
    } finally {
      setSavingEdits(false);
    }
  };

  // swipe-down-to-dismiss, scoped to the image area so notes/tabs stay scrollable
  const onImgTouchStart = (e) => { dragStartRef.current = e.touches[0].clientY; };
  const onImgTouchMove = (e) => {
    if (dragStartRef.current == null) return;
    const delta = e.touches[0].clientY - dragStartRef.current;
    if (delta > 0) setDragY(delta);
  };
  const onImgTouchEnd = () => {
    if (dragY > 90) { onClose(); return; }
    setDragY(0);
    dragStartRef.current = null;
  };

  const initial = (item.title || "?").trim().charAt(0).toUpperCase();

  return (
    <div className="wb-overlay wb-detail-overlay" onClick={onClose}>
      <div
        className="wb-detail-sheet"
        onClick={(e) => e.stopPropagation()}
        style={{
          transform: dragY ? `translateY(${dragY}px)` : undefined,
          opacity: dragY ? Math.max(1 - dragY / 400, 0.5) : 1,
          transition: dragY ? "none" : "transform .2s ease, opacity .2s ease",
        }}
      >
        <button className="wb-close-x" onClick={onClose} aria-label="Close"><XIcon size={18} /></button>
        <div
          className="wb-detail-img-wrap"
          onTouchStart={onImgTouchStart}
          onTouchMove={onImgTouchMove}
          onTouchEnd={onImgTouchEnd}
        >
          {item.image ? (
            <img src={item.image} alt={item.title} />
          ) : (
            <div className="wb-placeholder"><span>{initial}</span></div>
          )}
        </div>
        <div className="wb-detail-body">
          {editing ? (
            <>
              <EditPinFields item={draftItem} onChange={(patch) => setDraftItem((d) => ({ ...d, ...patch }))} />
              <div className="wb-sheet-actions">
                <button className="wb-cancel-btn" onClick={cancelEditing} type="button">Cancel</button>
                <button className="wb-save-btn" onClick={saveEditing} disabled={savingEdits || !(draftItem.title || "").trim()}>
                  {savingEdits ? "Saving…" : "Save changes"}
                </button>
              </div>
            </>
          ) : (
            <>
              <div className="wb-detail-title-row">
                <h2 className="wb-detail-title">{item.title}</h2>
                <button className="wb-detail-edit-btn" onClick={startEditing} type="button">
                  <EditIcon size={13} /> Edit
                </button>
              </div>
              <p className="wb-detail-price">{currency(item.price)}</p>
              {item.link ? (
                <a className="wb-item-source" href={item.link} target="_blank" rel="noreferrer" style={{ marginBottom: 16 }}>
                  {hostnameOf(item.link) || "view item"}
                </a>
              ) : null}

              <div className="wb-field">
                <label>Notes</label>
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  onBlur={handleNotesBlur}
                  placeholder="Add a note about this pin…"
                  rows={3}
                />
                {savingNotes ? <p className="wb-link-hint">Saving…</p> : null}
              </div>

              <div className="wb-field">
                <label>Move to</label>
                <div className="wb-detail-tabs">
                  <button
                    className={item.status === "wishlist" && !item.custom_tab_id ? "active" : ""}
                    onClick={() => onMoveStatus(item.id, "wishlist")}
                  >
                    Wishlist
                  </button>
                  <button
                    className={item.status === "purchased" && !item.custom_tab_id ? "active" : ""}
                    onClick={() => onMoveStatus(item.id, "purchased")}
                  >
                    Purchased
                  </button>
                  <button
                    className={item.status === "transcended" && !item.custom_tab_id ? "active" : ""}
                    onClick={() => onMoveStatus(item.id, "transcended")}
                  >
                    Transcended
                  </button>
                  {tabs.map((t) => (
                    <button
                      key={t.id}
                      className={item.custom_tab_id === t.id ? "active" : ""}
                      onClick={() => onMoveCustomTab(item.id, t.id)}
                    >
                      {t.name}
                    </button>
                  ))}
                </div>
              </div>

              <button className="wb-detail-delete" onClick={handleDelete}>
                <TrashIcon size={14} /> Delete pin
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function AddItemSheet({ open, onClose, onAdd, draftKey, tabs }) {
  const [imgMode, setImgMode] = useState("upload");
  const [imageUrl, setImageUrl] = useState("");
  const [uploadedImage, setUploadedImage] = useState("");
  const [title, setTitle] = useState("");
  const [price, setPrice] = useState("");
  const [link, setLink] = useState("");
  const [notes, setNotes] = useState("");
  const [pinTarget, setPinTarget] = useState("wishlist"); // "wishlist" | "purchased" | "transcended" | a custom tab id
  const fileRef = useRef(null);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState("");
  const [restoredDraft, setRestoredDraft] = useState(false);

  // --- link auto-fill state ---
  const [fetchingLink, setFetchingLink] = useState(false);
  const [linkFetchError, setLinkFetchError] = useState("");

  // --- crop state ---
  const [rawImage, setRawImage] = useState(""); // freshly-picked, not-yet-cropped photo
  const cropperImgRef = useRef(null);
  const cropperRef = useRef(null); // holds the live Cropper instance

  // --- swipe-down-to-dismiss (also saves a draft) ---
  const [dragY, setDragY] = useState(0);
  const dragStartRef = useRef(null);

  const destroyCropper = () => {
    if (cropperRef.current) {
      cropperRef.current.destroy();
      cropperRef.current = null;
    }
  };

  const reset = () => {
    setImgMode("upload"); setImageUrl(""); setUploadedImage("");
    setTitle(""); setPrice(""); setLink(""); setNotes(""); setSaveError("");
    setLinkFetchError(""); setFetchingLink(false); setRestoredDraft(false);
    setPinTarget("wishlist");
    destroyCropper();
    setRawImage("");
    if (fileRef.current) fileRef.current.value = "";
  };

  const hasUnsavedInput = () =>
    Boolean(title.trim() || price || link.trim() || notes.trim() || imageUrl.trim() || uploadedImage);

  const saveDraft = () => {
    try {
      if (!hasUnsavedInput()) {
        localStorage.removeItem(draftKey);
        return;
      }
      localStorage.setItem(
        draftKey,
        JSON.stringify({ title, price, link, notes, imgMode, imageUrl, uploadedImage, pinTarget })
      );
    } catch {
      // storage can fail (private browsing, quota) — draft loss is non-fatal
    }
  };

  const clearDraft = () => {
    try { localStorage.removeItem(draftKey); } catch { /* ignore */ }
  };

  useEffect(() => {
    if (open) {
      try {
        const raw = localStorage.getItem(draftKey);
        if (raw) {
          const draft = JSON.parse(raw);
          setTitle(draft.title || "");
          setPrice(draft.price || "");
          setLink(draft.link || "");
          setNotes(draft.notes || "");
          setImgMode(draft.imgMode || "upload");
          setImageUrl(draft.imageUrl || "");
          setUploadedImage(draft.uploadedImage || "");
          setPinTarget(draft.pinTarget || "wishlist");
          setRestoredDraft(true);
        }
      } catch {
        // ignore a corrupt draft
      }
    } else {
      destroyCropper();
      setDragY(0);
    }
  }, [open]);

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setRawImage(reader.result); // goes to the cropper, not straight to uploadedImage
    reader.readAsDataURL(file);
  };

  const clearChosenPhoto = () => {
    setUploadedImage("");
    setImageUrl("");
    if (fileRef.current) fileRef.current.value = "";
  };

  const handleCropperImgLoad = () => {
    destroyCropper();
    if (cropperImgRef.current && window.Cropper) {
      cropperRef.current = new window.Cropper(cropperImgRef.current, {
        aspectRatio: NaN, // freeform — no forced aspect ratio
        viewMode: 1, // crop box is clamped inside the photo's own bounds
        dragMode: "move", // phone-style: drag moves the existing box, resize via its own edge/corner handles
        autoCropArea: 0.9,
        background: false,
        responsive: true,
        cropBoxMovable: true,
        cropBoxResizable: true,
      });
    }
  };

  const applyCrop = () => {
    if (!cropperRef.current) return;
    const rootEl = cropperImgRef.current ? cropperImgRef.current.closest(".wb-root") : null;
    const fill = rootEl ? getComputedStyle(rootEl).getPropertyValue("--card").trim() : "#ffffff";
    const canvas = cropperRef.current.getCroppedCanvas({
      maxWidth: 1200,
      maxHeight: 1200,
      fillColor: fill || "#ffffff",
    });
    if (canvas) {
      setUploadedImage(canvas.toDataURL("image/jpeg", 0.85));
      setImgMode("upload");
    }
    destroyCropper();
    setRawImage("");
  };

  const cancelCrop = () => {
    destroyCropper();
    setRawImage("");
    if (fileRef.current) fileRef.current.value = "";
  };

  const handleAutoFill = async (urlOverride) => {
    const target = (urlOverride || link).trim();
    if (!target || fetchingLink) return;
    setFetchingLink(true);
    setLinkFetchError("");
    try {
      const meta = await fetchProductDetails(target);
      if (meta.title) setTitle(meta.title);
      if (meta.image) { setImgMode("url"); setImageUrl(meta.image); }
      if (meta.price) setPrice(meta.price);
      if (!meta.title && !meta.image && !meta.price) {
        setLinkFetchError("Found the page, but no usable details on it — fill these in yourself.");
      }
    } catch (err) {
      setLinkFetchError("Couldn't auto-fill from that link — the site may block this, or check the URL.");
    } finally {
      setFetchingLink(false);
    }
  };

  const handleLinkPaste = (e) => {
    const pasted = e.clipboardData.getData("text");
    if (pasted && pasted.trim().startsWith("http")) {
      setTimeout(() => handleAutoFill(pasted.trim()), 50);
    }
  };

  const canSave = title.trim().length > 0 && !saving;

  const requestClose = () => {
    saveDraft();
    reset();
    onClose();
  };

  const handleCancel = () => {
    if (!hasUnsavedInput()) {
      clearDraft();
      reset();
      onClose();
      return;
    }
    if (window.confirm("Discard this pin? This can't be undone.")) {
      clearDraft();
      reset();
      onClose();
    }
  };

  const isBuiltInTarget = pinTarget === "wishlist" || pinTarget === "purchased" || pinTarget === "transcended";

  const handleSave = async () => {
    if (!canSave) return;
    setSaving(true);
    setSaveError("");
    try {
      await onAdd({
        title: title.trim(),
        price: parseFloat(price) || 0,
        image: imgMode === "upload" ? uploadedImage : imageUrl.trim(),
        link: link.trim(),
        notes: notes.trim(),
        status: isBuiltInTarget ? pinTarget : "wishlist",
        custom_tab_id: isBuiltInTarget ? null : pinTarget,
        purchased_at: pinTarget === "purchased" ? new Date().toISOString() : null,
      });
      clearDraft();
      reset();
      onClose();
    } catch (err) {
      setSaveError(err.message || "Couldn't save this item — try again.");
    } finally {
      setSaving(false);
    }
  };

  const onHandleTouchStart = (e) => { dragStartRef.current = e.touches[0].clientY; };
  const onHandleTouchMove = (e) => {
    if (dragStartRef.current == null) return;
    const delta = e.touches[0].clientY - dragStartRef.current;
    if (delta > 0) setDragY(delta);
  };
  const onHandleTouchEnd = () => {
    if (dragY > 80) { requestClose(); return; }
    setDragY(0);
    dragStartRef.current = null;
  };

  if (!open) return null;
  const preview = imgMode === "upload" ? uploadedImage : imageUrl;

  const targetLabel = pinTarget === "wishlist" ? "Wishlist"
    : pinTarget === "purchased" ? "Purchased"
    : pinTarget === "transcended" ? "Transcended"
    : (tabs.find((t) => t.id === pinTarget) || {}).name || "Tab";

  return (
    <div className="wb-overlay" onClick={requestClose}>
      <div
        className="wb-sheet"
        onClick={(e) => e.stopPropagation()}
        style={{
          transform: dragY ? `translateY(${dragY}px)` : undefined,
          transition: dragY ? "none" : "transform .2s ease",
        }}
      >
        <div
          className="wb-sheet-handle"
          onTouchStart={onHandleTouchStart}
          onTouchMove={onHandleTouchMove}
          onTouchEnd={onHandleTouchEnd}
        />
        <button className="wb-close-x" onClick={requestClose} aria-label="Close"><XIcon size={20} /></button>
        <h2>Pin something new</h2>
        {restoredDraft ? <p className="wb-draft-hint">Continuing your last unfinished pin.</p> : null}

        <div className="wb-field">
          <label>Pin to</label>
          <div className="wb-detail-tabs">
            <button type="button" className={pinTarget === "wishlist" ? "active" : ""} onClick={() => setPinTarget("wishlist")}>Wishlist</button>
            <button type="button" className={pinTarget === "purchased" ? "active" : ""} onClick={() => setPinTarget("purchased")}>Purchased</button>
            <button type="button" className={pinTarget === "transcended" ? "active" : ""} onClick={() => setPinTarget("transcended")}>Transcended</button>
            {tabs.map((t) => (
              <button type="button" key={t.id} className={pinTarget === t.id ? "active" : ""} onClick={() => setPinTarget(t.id)}>
                {t.name}
              </button>
            ))}
          </div>
        </div>

        <div className="wb-field">
          <label>Link to the product (optional)</label>
          <div className="wb-link-row">
            <input
              type="text"
              placeholder="https://store.com/product"
              value={link}
              onChange={(e) => setLink(e.target.value)}
              onPaste={handleLinkPaste}
            />
            <button
              type="button"
              className="wb-autofill-btn"
              disabled={!link.trim() || fetchingLink}
              onClick={() => handleAutoFill()}
            >
              {fetchingLink ? "Fetching…" : "Auto-fill"}
            </button>
          </div>
          <p className="wb-link-hint">
            {fetchingLink
              ? "Looking up the title, photo, and price…"
              : "Paste a product link, then tap Auto-fill to grab its title, photo, and price."}
          </p>
          {linkFetchError ? <p className="wb-auth-error" style={{ marginTop: 6 }}>{linkFetchError}</p> : null}
        </div>

        <div className="wb-field">
          <label>Photo</label>
          {rawImage ? (
            <>
              <div className="wb-cropper-wrap">
                <img ref={cropperImgRef} src={rawImage} onLoad={handleCropperImgLoad} alt="Crop preview" />
              </div>
              <p className="wb-crop-hint">Drag the crop box's own edges/corners to resize — the box stays within the photo.</p>
              <div className="wb-cropper-actions">
                <button type="button" className="wb-cropper-cancel" onClick={cancelCrop}>Cancel</button>
                <button type="button" className="wb-save-btn" onClick={applyCrop}>Use this crop</button>
              </div>
            </>
          ) : (
            <>
              <div className="wb-imgmode">
                <button className={imgMode === "upload" ? "active" : ""} onClick={() => setImgMode("upload")} type="button">
                  <UploadIcon size={13} style={{ marginRight: 5, verticalAlign: -2 }} /> Upload photo
                </button>
                <button className={imgMode === "url" ? "active" : ""} onClick={() => setImgMode("url")} type="button">
                  <LinkIcon size={13} style={{ marginRight: 5, verticalAlign: -2 }} /> Paste image link
                </button>
              </div>
              {imgMode === "url" ? (
                <input type="text" placeholder="https://example.com/photo.jpg" value={imageUrl}
                       onChange={(e) => setImageUrl(e.target.value)} />
              ) : (
                <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} />
              )}
              {preview ? (
                <div style={{ position: "relative", display: "inline-block", marginTop: 8 }}>
                  <img className="wb-preview" src={preview} alt="Preview" style={{ marginTop: 0 }} />
                  <button
                    type="button"
                    onClick={clearChosenPhoto}
                    aria-label="Remove photo"
                    style={{
                      position: "absolute", top: 6, right: 6, width: 22, height: 22, borderRadius: "50%",
                      border: "none", background: "rgba(255,255,255,.9)", color: "var(--x-color)",
                      display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
                    }}
                  >
                    <XIcon size={13} />
                  </button>
                </div>
              ) : null}
            </>
          )}
        </div>

        <div className="wb-field">
          <label>What is it?</label>
          <input type="text" placeholder="e.g. Sherpa fleece jacket" value={title}
                 onChange={(e) => setTitle(e.target.value)} />
        </div>

        <div className="wb-field">
          <label>Price</label>
          <input type="number" inputMode="decimal" step="0.01" min="0" placeholder="0.00" value={price}
                 onChange={(e) => setPrice(e.target.value)} />
        </div>

        <div className="wb-field">
          <label>Notes (optional)</label>
          <textarea
            placeholder="Any thoughts on this one?"
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
            rows={3}
          />
        </div>

        <div className="wb-sheet-actions">
          <button type="button" className="wb-cancel-btn" onClick={handleCancel}>Cancel</button>
          <button className="wb-save-btn" disabled={!canSave} onClick={handleSave}>
            <PlusIcon size={16} style={{ verticalAlign: -3, marginRight: 4 }} /> {saving ? "Saving…" : `Add to ${targetLabel}`}
          </button>
        </div>
        {saveError ? <p className="wb-auth-error" style={{ marginTop: 10, marginBottom: 0 }}>{saveError}</p> : null}
      </div>
    </div>
  );
}

function Toast({ message, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 3200);
    return () => clearTimeout(t);
  }, [message]);
  if (!message) return null;
  return <div className="wb-toast">{message}</div>;
}

function Ticker() {
  const phrases = [
    "LIMITED TIME OFFER", "ACT NOW", "YOU DESERVE THIS", "FREE SHIPPING ON DESIRE",
    "BUY MORE SAVE MORE", "SUPPLIES WON'T LAST", "TREAT YOURSELF TODAY", "EXCLUSIVE ACCESS",
  ];
  const line = phrases.concat(phrases).join("   \u2726   ");
  return (
    <div className="wb-ticker">
      <div className="wb-ticker-track">
        <span>{line}</span>
        <span>{line}</span>
      </div>
    </div>
  );
}

// Tiny unobtrusive session clock — "TIME SPENT · 00:17:42"
function useElapsedTime() {
  const startRef = useRef(Date.now());
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setElapsed(Date.now() - startRef.current), 1000);
    return () => clearInterval(id);
  }, []);
  const totalSec = Math.floor(elapsed / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function useLastHere(userId) {
  const [lastHere, setLastHere] = useState("");
  useEffect(() => {
    const key = `wb-last-visit:${userId}`;
    try {
      const prev = localStorage.getItem(key);
      if (prev) {
        const diffMs = Date.now() - Number(prev);
        const mins = Math.floor(diffMs / 60000);
        if (mins < 1) setLastHere("just now");
        else if (mins < 60) setLastHere(`${mins}m ago`);
        else if (mins < 60 * 24) setLastHere(`${Math.floor(mins / 60)}h ago`);
        else setLastHere(`${Math.floor(mins / (60 * 24))}d ago`);
      }
      localStorage.setItem(key, String(Date.now()));
    } catch {
      // ignore
    }
  }, [userId]);
  return lastHere;
}

function HeaderMeta({ userId }) {
  const lastHere = useLastHere(userId);
  const elapsed = useElapsedTime();
  return (
    <div className="wb-header-meta">
      {lastHere ? <p>last here {lastHere}</p> : null}
      <p>TIME SPENT · {elapsed}</p>
    </div>
  );
}

function Footer({ theme }) {
  return (
    <div className="wb-footer">
      {theme === "surreal" ? (
        <div className="wb-olive-clock-wrap">
          <OliveTreeMeltingClock />
        </div>
      ) : null}
      <p className="wb-footer-line">DCC</p>
    </div>
  );
}

function Wishboard({ userId, userEmail }) {
  const { items, addItem, deleteItem, moveItem, updateItem, loaded } = useWishboardData(userId);
  const { tabs: customTabs, addTab, deleteTab } = useCustomTabs(userId);
  const [tab, setTab] = useState("wishlist");
  const [sheetOpen, setSheetOpen] = useState(false);
  const [openItemId, setOpenItemId] = useState(null);
  const [toastMsg, setToastMsg] = useState("");
  const [toastKey, setToastKey] = useState(0);
  const [sparkleKey, setSparkleKey] = useState(0);
  const [showSparkle, setShowSparkle] = useState(false);
  const [dragOverTab, setDragOverTab] = useState(null);
  const [theme, setThemeState] = useState(() => {
    try {
      const saved = localStorage.getItem("wb-theme");
      if (saved === "luxury" || saved === "playful") return "original"; // migrate retired themes
      return saved || "original";
    } catch { return "original"; }
  });

  const setTheme = (t) => {
    setThemeState(t);
    try { localStorage.setItem("wb-theme", t); } catch { /* ignore */ }
  };

  // lock background scroll while a sheet/modal is open
  useEffect(() => {
    const active = sheetOpen || Boolean(openItemId);
    document.body.style.overflow = active ? "hidden" : "";
    return () => { document.body.style.overflow = ""; };
  }, [sheetOpen, openItemId]);

  const showToast = (msg) => { setToastMsg(msg); setToastKey((k) => k + 1); };

  const handleTabChange = (newTab) => {
    // plain tab-click view switching — no toast, ever
    setTab(newTab);
  };

  // Toasts fire ONLY for these exact status transitions; every other move is silent.
  const handleMoveStatus = async (id, status) => {
    const item = items.find((i) => i.id === id);
    const fromStatus = item ? item.status : null;
    const wasCustomTab = item ? Boolean(item.custom_tab_id) : false;
    await moveItem(id, status);

    // Moving out of a custom tab into a built-in status isn't one of the
    // approved wishlist/purchased/transcended transitions — stay silent.
    if (wasCustomTab) return;

    if (fromStatus === "wishlist" && status === "purchased") {
      showToast(pickRandom(PURCHASE_MESSAGES));
    } else if (fromStatus === "wishlist" && status === "transcended") {
      const amt = item ? Number(item.price) || 0 : 0;
      showToast(`${pickRandom(TRANSCEND_MESSAGES)}\n+${currency(amt)} saved through detachment`);
    } else if (fromStatus === "transcended" && status === "wishlist") {
      showToast(pickRandom(RELAPSE_MESSAGES));
    }
    // purchased->wishlist, purchased->transcended, transcended->purchased: no popup, by design.
  };

  // Drag-and-drop onto a tab header: same status transition + toast logic as
  // the existing move buttons, just triggered by a drop instead of a click.
  const handleTabDragOver = (e, tabId) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (dragOverTab !== tabId) setDragOverTab(tabId);
  };
  const handleTabDragLeave = (tabId) => {
    setDragOverTab((current) => (current === tabId ? null : current));
  };
  const handleTabDrop = (e, status) => {
    e.preventDefault();
    setDragOverTab(null);
    const id = e.dataTransfer.getData("text/plain");
    if (id) handleMoveStatus(id, status);
  };

  const handleMoveCustomTab = (id, tabId) => updateItem(id, { custom_tab_id: tabId });
  const handleSaveNotes = (id, notes) => updateItem(id, { notes });
  const handleSaveEdits = (id, patch) => updateItem(id, patch);

  const handleAddTab = async () => {
    const name = window.prompt("Name your new tab:");
    if (!name || !name.trim()) return;
    try {
      await addTab(name.trim());
    } catch {
      alert("Couldn't create that tab — please try again.");
    }
  };

  const handleDeleteTab = (id) => {
    if (!window.confirm("Delete this tab? Items in it will move back to their original list.")) return;
    deleteTab(id);
    if (tab === id) setTab("wishlist");
  };

  const handleAdd = async (item) => {
    await addItem(item);
    // Sparkle celebration only for brand-new pins landing on Wishlist — no text, ever.
    if (item.status === "wishlist" && !item.custom_tab_id) {
      setSparkleKey((k) => k + 1);
      setShowSparkle(true);
    }
  };

  const wishlist = items.filter((i) => i.status === "wishlist" && !i.custom_tab_id);
  const purchased = items.filter((i) => i.status === "purchased" && !i.custom_tab_id);
  const transcended = items.filter((i) => i.status === "transcended" && !i.custom_tab_id);
  const wishlistTotal = wishlist.reduce((sum, i) => sum + (Number(i.price) || 0), 0);
  const purchasedTotal = purchased.reduce((sum, i) => sum + (Number(i.price) || 0), 0);
  const transcendedTotal = transcended.reduce((sum, i) => sum + (Number(i.price) || 0), 0);

  const isBuiltIn = tab === "wishlist" || tab === "purchased" || tab === "transcended";
  const activeCustomTab = !isBuiltIn ? customTabs.find((t) => t.id === tab) : null;

  const visible = isBuiltIn
    ? (tab === "wishlist" ? wishlist : tab === "purchased" ? purchased : transcended)
    : items.filter((i) => i.custom_tab_id === tab);

  const customTabTotal = !isBuiltIn ? visible.reduce((sum, i) => sum + (Number(i.price) || 0), 0) : 0;

  const subtitle = isBuiltIn
    ? (tab === "wishlist" ? "Pin what you want. Watch what it costs."
       : tab === "purchased" ? "The desire has become possession."
       : "\"All conditioned things are impermanent.\" \u2014 Dhammapada")
    : (activeCustomTab ? `Your "${activeCustomTab.name}" collection.` : "");

  const emptyText = isBuiltIn
    ? (tab === "wishlist" ? "Nothing pinned yet. Tap the + to add the first thing you're eyeing."
       : tab === "purchased" ? "Nothing spent yet."
       : "Nothing released yet.")
    : "Nothing here yet.";

  const summaryLabel = isBuiltIn
    ? (tab === "wishlist" ? "TOTAL" : tab === "purchased" ? "SPENT" : "SAVED THROUGH DETACHMENT")
    : `${activeCustomTab ? activeCustomTab.name.toUpperCase() : "TAB"} TOTAL`;
  const summaryTotal = isBuiltIn
    ? (tab === "wishlist" ? wishlistTotal : tab === "purchased" ? purchasedTotal : transcendedTotal)
    : customTabTotal;

  const openItem = openItemId ? items.find((i) => i.id === openItemId) : null;

  return (
    <div className="wb-root" data-theme={theme}>
      {theme === "absurdist" ? <Ticker /> : null}
      <div className="wb-header">
        <div className="wb-header-top">
          <div>
            <h1 className="wb-title">
              <span className="wb-title-logo"><Logo size={26} /></span>
              Wishboard
              {theme === "absurdist" ? <span className="wb-badge">CONSUMER PROFILE</span> : null}
            </h1>
            <p className="wb-subtitle">{subtitle}</p>
            {theme === "absurdist" && tab === "wishlist" ? <p className="wb-microcopy">Recommended for continued wanting.</p> : null}
          </div>
          <div className="wb-header-actions">
            <div className="wb-header-actions-row">
              <ThemeSwitcher theme={theme} onChange={setTheme} />
              <button className="wb-logout" onClick={() => supabaseClient.auth.signOut()}>
                Log out
              </button>
            </div>
            <HeaderMeta userId={userId} />
          </div>
        </div>
      </div>

      <div className="wb-tabs">
        <div
          className={`wb-tab ${tab === "wishlist" ? "active-wishlist" : ""} ${dragOverTab === "wishlist" ? "wb-tab-dragover" : ""}`}
          onClick={() => handleTabChange("wishlist")}
          onDragOver={(e) => handleTabDragOver(e, "wishlist")}
          onDragLeave={() => handleTabDragLeave("wishlist")}
          onDrop={(e) => handleTabDrop(e, "wishlist")}
        >
          Wishlist <span className="wb-count">{wishlist.length}</span>
        </div>
        <div
          className={`wb-tab ${tab === "purchased" ? "active-purchased" : ""} ${dragOverTab === "purchased" ? "wb-tab-dragover" : ""}`}
          onClick={() => handleTabChange("purchased")}
          onDragOver={(e) => handleTabDragOver(e, "purchased")}
          onDragLeave={() => handleTabDragLeave("purchased")}
          onDrop={(e) => handleTabDrop(e, "purchased")}
        >
          Purchased <span className="wb-count">{purchased.length}</span>
        </div>
        <div
          className={`wb-tab ${tab === "transcended" ? "active-transcended" : ""} ${dragOverTab === "transcended" ? "wb-tab-dragover" : ""}`}
          onClick={() => handleTabChange("transcended")}
          onDragOver={(e) => handleTabDragOver(e, "transcended")}
          onDragLeave={() => handleTabDragLeave("transcended")}
          onDrop={(e) => handleTabDrop(e, "transcended")}
        >
          Transcended <span className="wb-count">{transcended.length}</span>
        </div>
        {customTabs.map((ct) => {
          const count = items.filter((i) => i.custom_tab_id === ct.id).length;
          const active = tab === ct.id;
          return (
            <div key={ct.id} className={`wb-tab ${active ? "active-custom" : ""}`} onClick={() => handleTabChange(ct.id)}>
              {ct.name} <span className="wb-count">{count}</span>
              {active ? (
                <button className="wb-tab-delete" onClick={(e) => { e.stopPropagation(); handleDeleteTab(ct.id); }} aria-label="Delete tab">
                  <XIcon size={11} />
                </button>
              ) : null}
            </div>
          );
        })}
        <button className="wb-tab-add" onClick={handleAddTab} type="button" aria-label="Add custom tab">
          <PlusIcon size={14} />
        </button>
      </div>
      <div className="wb-tabline" />

      {visible.length > 0 && (
        <div className="wb-summary-sticky">
          <span className="wb-summary-label">{summaryLabel}</span>
          <span className={`wb-summary-total ${isBuiltIn ? tab : ""}`}>{currency(summaryTotal)}</span>
        </div>
      )}

      {loaded && visible.length === 0 ? (
        <div className="wb-empty">{emptyText}</div>
      ) : (
        <div className="wb-grid">
          {visible.map((item) => (
            <ItemCard key={item.id} item={item} onMove={handleMoveStatus} onDelete={deleteItem} onOpen={(i) => setOpenItemId(i.id)} theme={theme} />
          ))}
        </div>
      )}

      {visible.length > 0 && (
        <div className="wb-summary">
          <div className="wb-summary-row">
            <span className="wb-summary-label">{summaryLabel}</span>
            <span className={`wb-summary-total ${isBuiltIn ? tab : ""}`}>{currency(summaryTotal)}</span>
          </div>
        </div>
      )}

      <button className="wb-fab" onClick={() => setSheetOpen(true)} aria-label="Add item">
        <PlusIcon size={26} />
      </button>

      <AddItemSheet open={sheetOpen} onClose={() => setSheetOpen(false)} onAdd={handleAdd} draftKey={`wb-draft:${userId}`} tabs={customTabs} />
      <Toast key={toastKey} message={toastMsg} onDone={() => setToastMsg("")} />
      {showSparkle ? <SparkleBurst key={sparkleKey} onDone={() => setShowSparkle(false)} /> : null}

      {openItem ? (
        <PinDetailModal
          item={openItem}
          tabs={customTabs}
          onClose={() => setOpenItemId(null)}
          onMoveStatus={handleMoveStatus}
          onMoveCustomTab={handleMoveCustomTab}
          onDelete={deleteItem}
          onSaveNotes={handleSaveNotes}
          onSaveEdits={handleSaveEdits}
        />
      ) : null}

      <Footer theme={theme} />
    </div>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [busy, setBusy] = useState(false);

  const switchMode = (m) => { setMode(m); setError(""); setNotice(""); };

  const submit = async () => {
    if (!email.trim() || !password || busy) return;
    setBusy(true);
    setError("");
    setNotice("");
    try {
      if (mode === "login") {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email.trim(),
          password,
        });
        if (error) throw error;
      } else {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email.trim(),
          password,
        });
        if (error) throw error;
        if (data.user && !data.session) {
          setNotice("Check your email to confirm your account, then log in.");
        }
      }
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="wb-root wb-auth">
      <div className="wb-auth-card">
        <h1 className="wb-title"><span className="wb-title-logo"><Logo size={26} /></span>Wishboard</h1>
        <p className="wb-subtitle">Pin what you want. Watch what it costs.</p>

        <div className="wb-auth-tabs">
          <button className={mode === "login" ? "active" : ""} onClick={() => switchMode("login")} type="button">
            Log in
          </button>
          <button className={mode === "signup" ? "active" : ""} onClick={() => switchMode("signup")} type="button">
            Sign up
          </button>
        </div>

        <div className="wb-field">
          <label>Email</label>
          <input
            type="email"
            placeholder="you@example.com"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
          />
        </div>
        <div className="wb-field">
          <label>Password</label>
          <input
            type="password"
            placeholder="••••••••"
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()}
          />
        </div>

        {error ? <p className="wb-auth-error">{error}</p> : null}
        {notice ? <p className="wb-auth-notice">{notice}</p> : null}

        <button className="wb-save-btn" disabled={busy || !email.trim() || !password} onClick={submit}>
          {busy ? "Please wait…" : mode === "login" ? "Log in" : "Create account"}
        </button>
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(undefined); // undefined = checking, null = signed out

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      setSession(session);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return (
      <div className="wb-root wb-auth">
        <p className="wb-subtitle">Loading…</p>
      </div>
    );
  }

  if (!session) return <AuthScreen />;

  return <Wishboard userId={session.user.id} userEmail={session.user.email} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
