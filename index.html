<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishboard</title>
  <link rel="preconnect" href="https://googleapis.com" />
  <link href="https://googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cloudflare.com" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; }
    .wb-root {
      --paper: #F3EEE4;
      --ink: #2A2622;
      --muted: #8a8272;
      --plum: #5B3A4B;
      --gold: #C08A28;
      --sage: #6E8266;
      --line: #E1D8C4;
      --card: #FFFDF9;
      font-family: 'Space Grotesk', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 100px;
      box-sizing: border-box;
    }
    .wb-root *, .wb-root *::before, .wb-root *::after { box-sizing: border-box; }

    .wb-header { padding: 26px 20px 0; }
    .wb-header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .wb-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; font-size: 30px; margin: 0; letter-spacing: -0.01em; }
    .wb-subtitle { font-size: 13px; color: var(--muted); margin: 5px 0 0; }
    .wb-logout {
      background: none; border: 1px solid var(--line); color: var(--muted); padding: 7px 12px;
      border-radius: 8px; font-size: 12px; cursor: pointer; font-family: 'Space Grotesk', sans-serif;
      white-space: nowrap; margin-top: 4px;
    }

    .wb-tabs { display: flex; gap: 6px; margin: 22px 20px 0; }
    .wb-tab {
      padding: 10px 14px 12px; border-radius: 12px 12px 0 0; font-size: 13.5px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--line); border-bottom: none; background: #EAE2CE; color: var(--muted);
      transition: background .15s, color .15s;
    }
    .wb-tab .wb-count { margin-left: 6px; font-size: 11.5px; opacity: .65; }
    .wb-tab.active-wishlist { background: var(--card); color: var(--plum); box-shadow: 0 -3px 0 var(--plum) inset; }
    .wb-tab.active-purchased { background: var(--card); color: var(--sage); box-shadow: 0 -3px 0 var(--sage) inset; }
    .wb-tabline { height: 1px; background: var(--line); margin: 0 20px; }

    .wb-grid { column-count: 2; column-gap: 14px; padding: 18px 20px 0; }
    @media (min-width: 640px) { .wb-grid { column-count: 3; } }
    @media (min-width: 960px) { .wb-grid { column-count: 4; } }

    .wb-card { break-inside: avoid; margin-bottom: 14px; background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); position: relative; }
    .wb-imgwrap { position: relative; background: #ECE4D2; }
    .wb-imgwrap img { width: 100%; display: block; object-fit: cover; }
    .wb-placeholder { width: 100%; aspect-ratio: 4 / 5; background: linear-gradient(160deg, var(--plum), #7d5468); display: flex; align-items: center; justify-content: center; }
    .wb-placeholder span { font-family: 'Fraunces', serif; font-size: 46px; color: rgba(255,255,255,.85); }

    .wb-price-tag {
      position: absolute; bottom: -12px; left: 10px; background: var(--gold); color: #fff; font-weight: 700;
      font-size: 12.5px; padding: 5px 10px; border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,.2);
      font-variant-numeric: tabular-nums;
    }
    .wb-delete {
      position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
      background: rgba(178,42,42,.88); color: #fff; border: none; display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2; transition: background .15s;
    }
    .wb-delete:hover { background: rgba(150,32,32,.95); }

    .wb-body { padding: 20px 12px 12px; }
    .wb-item-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; margin: 0 0 4px; }
    .wb-item-source {
      font-size: 11px; color: var(--muted); margin: 0 0 12px; display: block; text-decoration: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wb-item-source[href] { color: #7d6a8f; }

    .wb-btn-move {
      font-family: 'Space Grotesk', sans-serif; font-size: 11.5px; font-weight: 600; padding: 7px 10px;
      border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      width: 100%; justify-content: center;
    }
    .wb-btn-move.to-purchased { background: var(--sage); color: #fff; }
    .wb-btn-move.to-wishlist { background: #EDE6D6; color: var(--ink); }

    .wb-summary { margin: 8px 20px 0; padding: 20px 4px 4px; border-top: 2px dashed var(--line); display: flex; align-items: baseline; justify-content: space-between; }
    .wb-summary-label { font-size: 13px; color: var(--muted); }
    .wb-summary-total { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; }
    .wb-summary-total.wishlist { color: var(--plum); }
    .wb-summary-total.purchased { color: var(--sage); }

    .wb-empty { margin: 56px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }

    .wb-fab {
      position: fixed; right: 20px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
      background: var(--plum); color: #fff; border: none; box-shadow: 0 8px 18px rgba(60,30,45,.35);
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 25;
    }

    .wb-overlay { position: fixed; inset: 0; background: rgba(30,26,22,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 40; }
    .wb-sheet { position: relative; background: var(--paper); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 18px 20px 28px; max-height: 88vh; overflow-y: auto; }
    .wb-sheet-handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 16px; }
    .wb-sheet h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 0 0 16px; }
    .wb-field { margin-bottom: 14px; }
    .wb-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .wb-field input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-family: 'Space Grotesk', sans-serif; font-size: 14px; background: #fff; color: var(--ink); }
    .wb-imgmode { display: flex; gap: 8px; margin-bottom: 10px; }
    .wb-imgmode button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--ink); }
    .wb-imgmode button.active { background: var(--plum); color: #fff; border-color: var(--plum); }
    
    .wb-crop-container { width: 100%; max-height: 200px; overflow: hidden; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; display: none; }
    .wb-crop-container img { max-width: 100%; display: block; }
    .wb-preview { width: 100%; height: 130px; border-radius: 10px; object-fit: cover; margin-top: 8px; border: 1px solid var(--line); display: none; }
    
    .wb-action-row { display: flex; gap: 10px; margin-top: 16px; }
    .wb-discard-btn { flex: 1; padding: 13px; border-radius: 12px; border: 1px solid #b22a2a; background: transparent; color: #b22a2a; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; }
    .wb-save-btn { flex: 2; padding: 13px; border-radius: 12px; border: none; background: var(--plum); color: #fff; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; }
    .wb-save-btn:disabled { opacity: .45; cursor: not-allowed; }

    .wb-root.wb-auth { padding-bottom: 0; display: flex; align-items: center; justify-content: center; }
    .wb-auth-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 30px 26px; box-shadow: 0 12px 30px rgba(50,30,40,.10); margin: 24px; }
    .wb-auth-tabs { display: flex; gap: 6px; margin: 22px 0 20px; border-bottom: 1px solid var(--line); }
    .wb-auth-tabs button { flex: 1; padding: 10px; background: none; border: none; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .wb-auth-tabs button.active { color: var(--plum); border-bottom-color: var(--plum); }
    .wb-auth-error { font-size: 12.5px; color: #a2453c; margin: -4px 0 12px; line-height: 1.5; }
    .wb-btn-autofill { background: var(--gold); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; margin-top: 6px; font-family: 'Space Grotesk', sans-serif; }
    .hidden { display: none !important; }
  </style>
</head>
