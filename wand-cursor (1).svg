<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wandShaft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#08080A"/>
      <stop offset="55%" stop-color="#1C1C22"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="wandTipCap" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8E4DC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="wandGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7DE" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FCE7A6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FCE7A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="55%" stop-color="#F7C948"/>
      <stop offset="100%" stop-color="#C98A2B"/>
    </radialGradient>
  </defs>

  <!-- soft glow behind the wand's lit tip -->
  <circle cx="25.5" cy="6.5" r="7.5" fill="url(#wandGlow)"/>

  <!-- black wand shaft, diagonal like the reference wand -->
  <line x1="9" y1="26.5" x2="22.5" y2="9.5" stroke="url(#wandShaft)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="9.6" y1="25.6" x2="21.7" y2="10.6" stroke="#3A3A42" stroke-width="0.7" stroke-linecap="round" opacity="0.55"/>

  <!-- cream/white capsule tip at the base end -->
  <line x1="6.3" y1="29.2" x2="10.4" y2="24.6" stroke="url(#wandTipCap)" stroke-width="4.4" stroke-linecap="round"/>

  <!-- glowing cream/white capsule tip at the working end -->
  <line x1="21" y1="11.2" x2="25.4" y2="6.2" stroke="url(#wandTipCap)" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="25.7" cy="5.9" r="1.6" fill="#FFFDF6"/>

  <!-- four-point gold sparkles trailing off the tip, echoing the reference art -->
  <path d="M29.5 2 Q30 3 31 3.5 Q30 4 29.5 5 Q29 4 28 3.5 Q29 3 29.5 2 Z" fill="url(#sparkGrad)"/>
  <path d="M23.2 2.6 Q23.55 3.3 24.3 3.6 Q23.55 3.9 23.2 4.6 Q22.85 3.9 22.1 3.6 Q22.85 3.3 23.2 2.6 Z" fill="url(#sparkGrad)"/>
  <path d="M29.8 10.4 Q30.1 11 30.7 11.2 Q30.1 11.4 29.8 12 Q29.5 11.4 28.9 11.2 Q29.5 11 29.8 10.4 Z" fill="url(#sparkGrad)"/>
  <path d="M26.4 13.6 Q26.65 14.1 27.2 14.3 Q26.65 14.5 26.4 15 Q26.15 14.5 25.6 14.3 Q26.15 14.1 26.4 13.6 Z" fill="url(#sparkGrad)"/>
</svg>
